<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1030" role="img" aria-labelledby="trusted-scene-renderer-t trusted-scene-renderer-d"><title id="trusted-scene-renderer-t">Replaceable architecture</title><desc id="trusted-scene-renderer-d">Application code owns consent and effects; provider and persistence adapters sit behind typed boundaries.</desc><defs><marker id="trusted-scene-renderer-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#698477" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ea"/><path d="M510 120 V157.5 H510 V195" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><text x="510.0" y="148.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">explicit action</text><path d="M510 295 V332.5 H510 V370" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><path d="M510 470 V507.5 H170 V545" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><text x="340.0" y="498.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">minimal context</text><path d="M510 470 V507.5 H850 V545" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><text x="680.0" y="498.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">explicit memory consent</text><path d="M170 645 V682.5 H510 V720" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><text x="340.0" y="673.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">validated reply</text><path d="M510 820 V857.5 H510 V895" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#trusted-scene-renderer-arrow)"/><g><rect x="365" y="20" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="42" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="71" font-family="Georgia,serif" font-size="21" fill="#254639">Deterministic UI</text><text x="383" y="98" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Navigation · consent · current request</text></g><g><rect x="365" y="195" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="217" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="246" font-family="Georgia,serif" font-size="21" fill="#254639">Typed local commands</text><text x="383" y="273" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Origin checks · bounds · safe errors</text></g><g><rect x="365" y="370" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="392" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="421" font-family="Georgia,serif" font-size="21" fill="#254639">Application orchestration</text><text x="383" y="448" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Authorize context · validate result</text></g><g><rect x="25" y="370" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="43" y="392" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="43" y="421" font-family="Georgia,serif" font-size="21" fill="#254639">Domain contracts</text><text x="43" y="448" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Scene v1 · consent · revisions</text></g><g><rect x="25" y="545" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="43" y="567" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="43" y="596" font-family="Georgia,serif" font-size="21" fill="#254639">ModelProvider</text><text x="43" y="623" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">OpenAI Responses · one bounded call</text></g><g><rect x="705" y="545" width="290" height="100" rx="17" fill="#fffdf7" stroke="#8c9f8e" stroke-width="1.5"/><text x="723" y="567" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#8c9f8e">MIXED</text><text x="723" y="596" font-family="Georgia,serif" font-size="21" fill="#254639">MemoryRepository</text><text x="723" y="623" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">SQLite now · Postgres adapter later</text></g><g><rect x="365" y="720" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="742" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="771" font-family="Georgia,serif" font-size="21" fill="#254639">Validated SceneSpec</text><text x="383" y="798" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">No model HTML, JS or tool execution</text></g><g><rect x="365" y="895" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="917" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="946" font-family="Georgia,serif" font-size="21" fill="#254639">Trusted scene renderer</text><text x="383" y="973" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Keyboard · simple view · reduced motion</text></g></svg>