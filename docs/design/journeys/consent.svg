<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1030" role="img" aria-labelledby="inspect,-pause-or-forget-t inspect,-pause-or-forget-d"><title id="inspect,-pause-or-forget-t">Consent and durable memory</title><desc id="inspect,-pause-or-forget-d">Current AI processing, selected answer sharing and durable memory are independent choices.</desc><defs><marker id="inspect,-pause-or-forget-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#698477" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ea"/><path d="M170 120 V157.5 H170 V195" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><path d="M510 120 V157.5 H510 V195" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><path d="M850 120 V157.5 H850 V195" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><path d="M850 295 V332.5 H850 V370" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><text x="850.0" y="323.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">remember</text><path d="M850 470 V507.5 H850 V545" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><path d="M170 295 V507.5 H510 V720" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><text x="340.0" y="498.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">explicit Send</text><path d="M510 295 V507.5 H510 V720" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><text x="510.0" y="498.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">explicit Share</text><path d="M850 645 V682.5 H510 V720" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><text x="680.0" y="673.5" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">allow</text><path d="M850 645 V770.0 H850 V895" fill="none" stroke="#698477" stroke-width="2" marker-end="url(#inspect,-pause-or-forget-arrow)"/><text x="850.0" y="761.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#365247" paint-order="stroke" stroke="#f7f4ea" stroke-width="5">pause / delete</text><g><rect x="25" y="20" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="43" y="42" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="43" y="71" font-family="Georgia,serif" font-size="21" fill="#254639">Typed or dictated words</text><text x="43" y="98" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Dictation consent precedes capture</text></g><g><rect x="365" y="20" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="42" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="71" font-family="Georgia,serif" font-size="21" fill="#254639">Private practice answers</text><text x="383" y="98" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Not included automatically</text></g><g><rect x="705" y="20" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="723" y="42" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="723" y="71" font-family="Georgia,serif" font-size="21" fill="#254639">A memory in your words</text><text x="723" y="98" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Goal, challenge or preference</text></g><g><rect x="25" y="195" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="43" y="217" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="43" y="246" font-family="Georgia,serif" font-size="21" fill="#254639">Review before sending</text><text x="43" y="273" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Stop → transcription → editable text</text></g><g><rect x="365" y="195" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="383" y="217" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="383" y="246" font-family="Georgia,serif" font-size="21" fill="#254639">Select what to share</text><text x="383" y="273" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Only selected answers leave the app</text></g><g><rect x="705" y="195" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="723" y="217" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="723" y="246" font-family="Georgia,serif" font-size="21" fill="#254639">Remember / Edit / Not now</text><text x="723" y="273" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">No silent import or personality labels</text></g><g><rect x="705" y="370" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="723" y="392" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="723" y="421" font-family="Georgia,serif" font-size="21" fill="#254639">Local durable memory</text><text x="723" y="448" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">SQLite · outside Git · plaintext</text></g><g><rect x="705" y="545" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="723" y="567" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="723" y="596" font-family="Georgia,serif" font-size="21" fill="#254639">Allow memory with AI?</text><text x="723" y="623" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Separate per-request control</text></g><g><rect x="365" y="720" width="290" height="100" rx="17" fill="#fffdf7" stroke="#8c9f8e" stroke-width="1.5"/><text x="383" y="742" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#8c9f8e">MIXED</text><text x="383" y="771" font-family="Georgia,serif" font-size="21" fill="#254639">Only approved context</text><text x="383" y="798" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Constrained model → validated scene</text></g><g><rect x="25" y="895" width="290" height="100" rx="17" fill="#fffdf7" stroke="#8c9f8e" stroke-width="1.5"/><text x="43" y="917" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#8c9f8e">MIXED</text><text x="43" y="946" font-family="Georgia,serif" font-size="21" fill="#254639">No permission? Local use.</text><text x="43" y="973" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Draft retained; no AI request</text></g><g><rect x="705" y="895" width="290" height="100" rx="17" fill="#e2ece2" stroke="#4c6d59" stroke-width="1.5"/><text x="723" y="917" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#4c6d59">EXISTS</text><text x="723" y="946" font-family="Georgia,serif" font-size="21" fill="#254639">Inspect, pause or forget</text><text x="723" y="973" font-family="Arial,sans-serif" font-size="14" fill="#4b5c50">Revision checks prevent stale writes</text></g></svg>