<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602"><rect width="1000" height="602" rx="24" fill="#FAF7EF"/><rect x="50.0" y="35" width="900.0" height="88" rx="15" fill="#DCE8DD"/><text x="500.0" y="69" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#183F3B">Direct control</text><text x="500.0" y="98" text-anchor="middle" font-family="Arial" font-size="17" fill="#183F3B">Gain, EQ, reverb, timer</text><path d="M500 127 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#61746E" stroke-width="2"/><rect x="50.0" y="153" width="900.0" height="88" rx="15" fill="#E9C883"/><text x="500.0" y="187" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#183F3B">Musical request</text><text x="500.0" y="216" text-anchor="middle" font-family="Arial" font-size="17" fill="#183F3B">Tempo, palette, feel, instrumental</text><path d="M500 245 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#61746E" stroke-width="2"/><rect x="50.0" y="271" width="900.0" height="88" rx="15" fill="#DCE8DD"/><text x="500.0" y="305" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#183F3B">Candidate + adherence check</text><text x="500.0" y="334" text-anchor="middle" font-family="Arial" font-size="17" fill="#183F3B">Confidence plus human review</text><path d="M500 363 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#61746E" stroke-width="2"/><rect x="50.0" y="389" width="900.0" height="88" rx="15" fill="#E9C883"/><text x="500.0" y="423" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#183F3B">Approved replacement</text><text x="500.0" y="452" text-anchor="middle" font-family="Arial" font-size="17" fill="#183F3B">No guaranteed stems or exact notes</text><text x="500" y="574" text-anchor="middle" font-family="Arial" font-size="18" fill="#61746E">A request is not a deterministic composition constraint.</text></svg>