<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" rx="20" fill="#FAF7EF"/><text x="40" y="38" font-family="Arial" font-size="24" font-weight="bold" fill="#183F3B">Soulfire</text><text x="960" y="38" text-anchor="end" font-family="Arial" font-size="17" fill="#61746E">Simulations   Current   Ember</text><path d="M40 55 H960" stroke="#CCD8CB"/><text x="40" y="100" font-family="Georgia" font-size="35" fill="#183F3B">Current</text><text x="40" y="132" font-family="Arial" font-size="18" fill="#61746E">Music at your pace. Two ways to begin.</text><rect x="35" y="155" width="445" height="295" rx="18" fill="#FFFFFF" stroke="#D4DFD1"/><text x="59" y="192" font-family="Arial" font-size="24" font-weight="bold" fill="#183F3B">Shape now</text><text x="59" y="220" font-family="Arial" font-size="16" fill="#61746E">An approved piece, ready to play</text><rect x="520" y="155" width="445" height="295" rx="18" fill="#FFFFFF" stroke="#D4DFD1"/><text x="544" y="192" font-family="Arial" font-size="24" font-weight="bold" fill="#183F3B">Create for me</text><text x="544" y="220" font-family="Arial" font-size="16" fill="#61746E">Your preferences, prepared in the background</text><text x="59" y="255" font-family="Arial" font-size="17" fill="#183F3B">Level</text><path d="M185 249 H440" stroke="#DCE8DD" stroke-width="8" stroke-linecap="round"/><circle cx="290" cy="249" r="10" fill="#5D8275"/><text x="59" y="302" font-family="Arial" font-size="17" fill="#183F3B">Brightness</text><path d="M185 296 H440" stroke="#DCE8DD" stroke-width="8" stroke-linecap="round"/><circle cx="320" cy="296" r="10" fill="#5D8275"/><text x="59" y="349" font-family="Arial" font-size="17" fill="#183F3B">Space</text><path d="M185 343 H440" stroke="#DCE8DD" stroke-width="8" stroke-linecap="round"/><circle cx="350" cy="343" r="10" fill="#5D8275"/><rect x="59" y="389" width="180" height="39" rx="18" fill="#183F3B"/><text x="149" y="414" text-anchor="middle" font-family="Arial" font-size="17" fill="white">Play / Pause</text><text x="350" y="414" font-family="Arial" font-size="17" fill="#183F3B">Stop</text><text x="544" y="263" font-family="Arial" font-size="18" fill="#183F3B">Intent: Settle</text><text x="544" y="306" font-family="Arial" font-size="18" fill="#183F3B">Taste: soft piano / no vocals</text><text x="544" y="349" font-family="Arial" font-size="18" fill="#183F3B">Duration: 15 minutes</text><rect x="544" y="389" width="245" height="39" rx="18" fill="#E9C883"/><text x="666" y="414" text-anchor="middle" font-family="Arial" font-size="17" fill="#183F3B">Prepare my Current</text><text x="500" y="485" text-anchor="middle" font-family="Arial" font-size="17" fill="#61746E">Illustrated concept only / new music never autoplays</text></svg>